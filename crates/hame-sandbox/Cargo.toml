[package]
name = "hame-sandbox"
description = "OS-level confinement for tool execution: policy, platform backends, worker protocol and egress proxy."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hame-kernel.workspace = true
hame-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = "0.23"
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
base64.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemServices"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
