[package]
name = "zcode-plugin-wordcount"
description = "Example zcode plugin: text statistics, with file access only where the user grants it."
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true

[workspace]
