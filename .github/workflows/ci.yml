name: ci
# Started by hand only (Actions tab, or `gh workflow run ci`), to keep
# within the account's Actions allowance. Run it before a release, or when a
# change touches platform-specific code.
on:
  workflow_dispatch:
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Windows runs every test that does not need a Unix shell, plus its own
  # sandbox tests (write confinement through integrity levels).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --workspace
      - run: cargo test --workspace --no-fail-fast
