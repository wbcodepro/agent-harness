name: ci
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Windows has no sandbox backend yet, and this job has never run: the
  # project was developed on macOS, where the Windows build cannot be
  # compiled. It is allowed to fail until someone has made it pass.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --workspace
      - run: cargo test --workspace --no-fail-fast
