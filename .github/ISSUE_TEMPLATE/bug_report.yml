name: Bug report
description: Something does not work as the README says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: please follow SECURITY.md instead of filing a public issue.
        Remove API keys and other secrets from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran and, if possible, a small project or prompt that shows it.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `hame doctor`
      description: It shows the version, provider, model and sandbox status, never key values.
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: macOS 26.1, Ubuntu 24.04, Windows 11 24H2...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant log
      description: Error output, or the part of `hame show <session id>` that shows the problem.
      render: text
