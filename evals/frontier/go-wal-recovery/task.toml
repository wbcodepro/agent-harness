prompt = "This Go module holds package `wal`, a write-ahead key-value log, and the starting code in wal.go handles only the simple path: appending single records to one segment and replaying them on Open. Complete the package so that it does everything SPEC.md describes, including atomic batches, the links that chain each segment to the one below it, and compaction, using only the Go standard library. SPEC.md is the only source of truth and the work will be judged against the whole of it, rule by rule, not against the examples at its end. It defines the file format, segment rotation, the exact error values and the order in which they are checked, what Open does with torn, corrupt, stale, obsolete, leftover and foreign files, how batches and links are written and verified, the exact steps of compaction, the poisoning of a log after a file system error, and which files may be open at any time. Every file system access must go through Options.FS, and the package must stay correct when that file system fails a call or the process dies at any point, as rules 13 to 15 and 31 to 33 describe. Several later rules extend earlier ones (rules 34 to 41 change how rules 9, 10, 19, 21, 22 and 24 apply), so read every numbered rule closely before you write code, and re-read them when you think you are done. Keep the module name and the declarations in fs.go and wal.go, including the exported names and signatures."
check = "find speccheck -type f ! -name spec_test.go -delete; go test -count=1 -timeout 80s ./speccheck/ 2>&1 | tail -1 | grep -q '^ok'"
