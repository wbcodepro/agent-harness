prompt = "This Rust crate, `textpos`, is a text index that converts between byte offsets, line/column positions and UTF-16 offsets and supports edits; SPEC.md specifies it and is the only source of truth. In src/lib.rs about half of the API is written, correctly but in linear time, and the other half panics with `todo!`, including the anchors that edits move along (rules 29 to 32). Finish the whole API and make it fast: rules 33 and 34 require every query to take O(log n) time and every edit O(log n + k) time, and a text of 8 MiB with lines of a million bytes, a million anchors, 100,000 edits and over a million queries must be handled in seconds, so the linear methods have to be replaced as well. The work will be judged against the whole spec, rule by rule, not only the examples: how CR, LF and CR LF form line breaks, also when an edit joins or splits them, what a column means in each of the four units (including display columns with tab stops), positions inside a multi-byte character, a surrogate pair, a tab or a CR LF break, positions past the end of a line or of the text, how each edit moves an anchor of either bias, and exactly which error, with which field values, each invalid input produces. Read every numbered rule closely before you write code and again when you think you are done. Keep the public types and method signatures exactly as they are, use only the standard library, and make sure `cargo test --release --offline` passes; tests/basic.rs holds a few of the spec's examples and you may extend it."
check = "cargo test --release --offline -q --test spec_check 2>&1 | tail -3 | grep -q 'test result: ok'"
