prompt = "This is a Go module with one package, `pool`. `Run(ctx, workers, tasks)` in pool.go is meant to run the tasks on a bounded pool, but it ignores cancellation, abandons running tasks and leaks goroutines when a task fails. Rewrite it to meet all of the following, using only the standard library and keeping the exported names and signatures. At most `workers` tasks run at the same time, and when more than `workers` tasks are waiting, `workers` of them do run at the same time; with one worker the tasks run one at a time in slice order; `workers < 1` returns `ErrNoWorkers` without running anything. Each task receives a context derived from `ctx` that is also cancelled as soon as any task returns a non-nil error. Once `ctx` has been cancelled or a task has returned a non-nil error, no further task may begin executing, not even one. Run returns only after every task it started has returned, however long that takes, and when it returns no goroutine it created is still running, also when `ctx` is never cancelled. The result is the first non-nil error returned by a task, first in time rather than in slice order; if no task returned an error, it is `ctx.Err()` when some task was never started, and nil when every task ran and returned nil, even if `ctx` was cancelled while the last tasks were running."
check = "go test -count=1 -timeout 50s ./... 2>&1 | tail -3 | grep -q '^ok'"
