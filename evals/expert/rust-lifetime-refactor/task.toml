prompt = "This is a Rust library crate, `kvlog`, that parses `key=value` log lines. Today every layer copies text: the lexer builds `String`s from a `Vec<char>`, records own their fields, the index clones whole records and the getters clone again. Redesign it to the zero-copy API specified in DESIGN.md, across the lexer, record, parser, index and stats modules. The observable requirements are the numbered rules in DESIGN.md: keys, raw lines, bare values and quoted values without escapes must be slices of the caller's input buffer (the same memory, not equal copies), only values that contain escapes may be owned, `Index` must hand out references to the caller's records rather than copies, and every borrowed string must stay usable for as long as the input lives, even after the records, the iterator or the index have been dropped. Add the `records` iterator described there, which keeps going after a bad line. The log format and the errors must not change; in particular error columns still count characters, not bytes, also for non-ASCII text. Do not use `unsafe`, do not leak memory to get long lifetimes, and add no dependencies. Update tests/basic.rs to the new API and make sure `cargo test --offline` passes."
check = "cargo test --offline -q --test zero_copy 2>&1 | tail -3 | grep -q 'test result: ok'"
