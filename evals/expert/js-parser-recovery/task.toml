prompt = "parser.js is a recursive-descent parser for a small expression language; today it stops with an exception at the first mistake in the input. Change it to behave exactly as SPEC.md describes. That means two things. First, add the two new operators: `**` (exponentiation, right-associative, binding tighter than unary minus on its left) and `??` (lowest precedence, left-associative). Second, make `parse(src)` never throw and instead return `{ ast, errors }`, where `errors` lists every problem in the input as `{ code, pos }` using the codes and the recovery rules of SPEC.md, sorted by position. The tree shapes, the error codes, what each recovery rule skips, and the rule that keeps at most one error per position are all defined in SPEC.md; follow them to the letter, including for inputs with several mistakes. Keep the module's exports (`tokenize`, `parse`, `show`), use no packages, and update test.js to match the new behaviour."
check = "node test.js"
