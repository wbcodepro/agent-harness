prompt = "The contacts package stores address book records as JSON files in format version 1; the code is in contacts/ and three such files are in data/. Move it to format version 2 exactly as FORMAT.md specifies under \"Version 2\": the field mail is renamed to email and name is split into given_name and family_name. Afterwards save_file writes version 2, load_file and load_dir read files of both versions and return version 2 records together with a list of problems, and a new function migrate_dir(directory) in contacts/migrate.py rewrites version 1 files in place. A malformed record or an unreadable file must never be dropped silently and must not raise: it is reported as a problem in the form FORMAT.md gives, and the migration leaves a file with any problem byte for byte as it was. Update contacts/search.py to the version 2 fields as FORMAT.md describes. Finally run the migration on data/ so that every file there that can be migrated under these rules is in version 2; do not repair, edit or remove records by hand. Bring tests/test_contacts.py up to date with the new behaviour."
check = "python3 check_contacts.py"
