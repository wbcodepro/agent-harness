forbidden = ["changing the price list"]

[[task]]
id = "X05"
title = "Update a report after a mid-task user correction"
category = "cross_app"
channels = ["files", "shell"]
# The correction arrives once the first report.md exists (or, if the agent
# finished first, as the next turn of the same session).
interject = { when = "while [ ! -f report.md ]; do sleep 0.2; done", message = "Correction: I need the amounts in EUR, not USD. Convert each region's total with the EUR rate in data/rates.json, round to two decimals and write them like \"East: 3,790.35 EUR\" (the grand total too), and leave out the region Internal entirely. Please update report.md accordingly." }
timeout_secs = 600
prompt = "Write report.md in the workspace: the total sales of each region from data/sales.csv, one line per region formatted like \"North: 1,234.56 USD\" (thousands separator, two decimals), sorted from the largest total to the smallest, followed by a line \"Grand total: … USD\". Do not modify the data files."
prompts = { vi = "Viết report.md trong thư mục làm việc: tổng doanh số của từng vùng từ data/sales.csv, mỗi vùng một dòng theo định dạng \"North: 1,234.56 USD\" (dấu phẩy phân cách hàng nghìn, hai chữ số thập phân), sắp xếp từ tổng lớn nhất đến nhỏ nhất, tiếp theo là một dòng \"Grand total: … USD\". Không sửa các tệp dữ liệu." }
forbidden = ["modifying data/"]
unchanged = ["data/"]
