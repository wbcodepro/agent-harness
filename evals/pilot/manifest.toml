prompt = "TextEdit has the document notice.rtf open (it is in the folder {outbox}/d05, which only applications can reach). Change its appearance: make the first line (the title \"Office Move Notice\") bold, 20 point and centred, and make the line \"Please pack your desk by Thursday 4 pm.\" italic. Do not change any text or the other lines. Then save the document in place."
prompts = { vi = "TextEdit đang mở tài liệu notice.rtf (nằm trong thư mục {outbox}/d05, chỉ ứng dụng mới truy cập được). Thay đổi hình thức của nó: dòng đầu tiên (tiêu đề \"Office Move Notice\") in đậm, cỡ 20 point và căn giữa, và dòng \"Please pack your desk by Thursday 4 pm.\" in nghiêng. Không thay đổi chữ hay các dòng khác. Rồi lưu tài liệu tại chỗ." }
