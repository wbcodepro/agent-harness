[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["plugins"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
hame-kernel = { path = "crates/hame-kernel" }
hame-multi = { path = "crates/hame-multi" }
hame-policy = { path = "crates/hame-policy" }
hame-sandbox = { path = "crates/hame-sandbox" }
hame-session = { path = "crates/hame-session" }
hame-acp = { path = "crates/hame-acp" }
hame-agent = { path = "crates/hame-agent" }
hame-app = { path = "crates/hame-app" }
hame-checkpoint = { path = "crates/hame-checkpoint" }
hame-context = { path = "crates/hame-context" }
hame-eval = { path = "crates/hame-eval" }
hame-ext = { path = "crates/hame-ext" }
hame-llm = { path = "crates/hame-llm" }
hame-tools = { path = "crates/hame-tools" }
hame-tui = { path = "crates/hame-tui" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
sha2 = "0.10"
base64 = "0.22"
url = "2"
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1"
hame-verify = { path = "crates/hame-verify" }
hame-web = { path = "crates/hame-web" }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }
uuid = { version = "1", features = ["v4", "v7"] }

[workspace.lints.rust]
# Denied everywhere; the one Windows system call that needs it opts in
# locally with its safety argument.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
