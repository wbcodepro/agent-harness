[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["plugins"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
hx-kernel = { path = "crates/hx-kernel" }
hx-multi = { path = "crates/hx-multi" }
hx-policy = { path = "crates/hx-policy" }
hx-sandbox = { path = "crates/hx-sandbox" }
hx-session = { path = "crates/hx-session" }
hx-acp = { path = "crates/hx-acp" }
hx-agent = { path = "crates/hx-agent" }
hx-app = { path = "crates/hx-app" }
hx-checkpoint = { path = "crates/hx-checkpoint" }
hx-context = { path = "crates/hx-context" }
hx-eval = { path = "crates/hx-eval" }
hx-ext = { path = "crates/hx-ext" }
hx-llm = { path = "crates/hx-llm" }
hx-tools = { path = "crates/hx-tools" }
hx-tui = { path = "crates/hx-tui" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1"
hx-verify = { path = "crates/hx-verify" }
hx-web = { path = "crates/hx-web" }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }
uuid = { version = "1", features = ["v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
