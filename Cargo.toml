[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["plugins"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
zcode-kernel = { path = "crates/zcode-kernel" }
zcode-multi = { path = "crates/zcode-multi" }
zcode-policy = { path = "crates/zcode-policy" }
zcode-sandbox = { path = "crates/zcode-sandbox" }
zcode-session = { path = "crates/zcode-session" }
zcode-acp = { path = "crates/zcode-acp" }
zcode-agent = { path = "crates/zcode-agent" }
zcode-app = { path = "crates/zcode-app" }
zcode-checkpoint = { path = "crates/zcode-checkpoint" }
zcode-context = { path = "crates/zcode-context" }
zcode-eval = { path = "crates/zcode-eval" }
zcode-ext = { path = "crates/zcode-ext" }
zcode-llm = { path = "crates/zcode-llm" }
zcode-tools = { path = "crates/zcode-tools" }
zcode-tui = { path = "crates/zcode-tui" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1"
zcode-verify = { path = "crates/zcode-verify" }
zcode-web = { path = "crates/zcode-web" }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }
uuid = { version = "1", features = ["v4", "v7"] }

[workspace.lints.rust]
# Denied everywhere; the one Windows system call that needs it opts in
# locally with its safety argument.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
