[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
hx-kernel = { path = "crates/hx-kernel" }
hx-session = { path = "crates/hx-session" }
hx-agent = { path = "crates/hx-agent" }
hx-eval = { path = "crates/hx-eval" }
hx-llm = { path = "crates/hx-llm" }
hx-tools = { path = "crates/hx-tools" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
